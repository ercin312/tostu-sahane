name: Android Build

# Otomatik çalışmaz — sadece Actions → Run workflow
on:
  workflow_dispatch:
    inputs:
      use_mock_api:
        description: Use mock API (demo mode — Google/email auth needs this OFF)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Prepare Firebase config for CI
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
            echo "::notice::Using google-services.json.example (set ANDROID_GOOGLE_SERVICES_JSON_BASE64 for a custom file)."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK (release, no signing)
        env:
          USE_MOCK_API: ${{ inputs.use_mock_api == true && 'true' || 'false' }}
        run: flutter build apk --release --dart-define=USE_MOCK_API=${USE_MOCK_API}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
